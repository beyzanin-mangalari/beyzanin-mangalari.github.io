<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beyza'nın Mangaları</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Beyza'nın manga rafı: seriler, son çıkan ve son alınan ciltler.">
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: kitap rafı — mürekkep başlık, ekran tonu (halftone) zemin, kapaklar cilt sırtı gibi dizilir */
:root{
  --paper:#f3f2f7; --card:#ffffff; --ink:#17141f; --muted:#6b6678; --line:#dcd9e4;
  --accent:#d6246a; --accent-soft:#fbe3ec; --ok:#1f8a5b; --ok-soft:#e1f4ea; --dot:rgba(23,20,31,.07);
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15131b; --card:#1f1c28; --ink:#f1eef7; --muted:#a19bb0; --line:#34303f;
  --accent:#ff5c97; --accent-soft:#3d1a2a; --ok:#4fd197; --ok-soft:#163327; --dot:rgba(255,255,255,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15131b; --card:#1f1c28; --ink:#f1eef7; --muted:#a19bb0; --line:#34303f;
  --accent:#ff5c97; --accent-soft:#3d1a2a; --ok:#4fd197; --ok-soft:#163327; --dot:rgba(255,255,255,.05); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:9px 9px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,8vw,76px);line-height:.95;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:12px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.btn{font:600 14px var(--body);border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent);color:#fff}
.btn.sm{padding:4px 11px;font-size:13px;border-width:1.5px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar input{flex:1 1 220px;min-width:0;font:15px var(--body);padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px}
.chip{font:600 13px var(--body);padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:28px 22px}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}}
.m{display:flex;flex-direction:column;gap:10px;min-width:0}
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:4px 10px 10px 4px;overflow:hidden;background:var(--line);
  box-shadow:inset 6px 0 8px -4px rgba(0,0,0,.35),0 10px 22px -12px rgba(23,20,31,.55);transition:transform .2s}
.m:hover .cover{transform:translateY(-4px) rotate(-.6deg)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;font-family:var(--display);font-size:20px;color:var(--muted);
  background:radial-gradient(var(--dot) 1.5px,transparent 1.6px) 0 0/7px 7px,var(--card)}
.stamp{position:absolute;top:10px;right:-4px;background:var(--accent);color:#fff;font:500 11px var(--mono);letter-spacing:.06em;padding:4px 10px 4px 8px;border-radius:3px 0 0 3px;text-transform:uppercase}
.stamp.ok{background:var(--ok)}
.m h3{margin:0;font-weight:800;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.vols{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vols b{color:var(--ink);font-weight:500}
.track{display:flex;gap:2px;height:7px}
.track i{flex:1;border-radius:1px;background:var(--line)}
.track i.on{background:var(--ink)}
.track i.miss{background:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:6px}
/* yönetim */
.adminbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px}
.adminbar .t{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;flex:1}
.adminbar .btn{border-color:var(--paper);background:transparent;color:var(--paper)}
.adminbar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(15,12,20,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--card);color:var(--ink);border-radius:18px;width:100%;max-width:460px;max-height:calc(100% - 32px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.modal input{font:15px var(--body);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--accent);font-size:13px;min-height:1em;margin:0}
.mrow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Manga rafı · cilt takibi</div>
      <h1>Beyza'nın <span>Mangaları</span></h1>
      <div class="stats" id="stats"><span>Raf yükleniyor…</span></div>
    </div>
    <button class="btn" id="adminBtn" type="button">Yönetim</button>
  </header>

  <div class="adminbar" id="adminbar" hidden>
    <span class="t">Yönetim modu açık</span>
    <button class="btn primary sm" id="addBtn" type="button">+ Manga ekle</button>
    <button class="btn sm" id="logoutBtn" type="button">Çıkış</button>
  </div>

  <div class="bar">
    <input id="q" type="search" placeholder="Seri ara…" aria-label="Seri ara">
    <div class="chips" role="group" aria-label="Filtre">
      <button class="chip" type="button" data-f="all" aria-pressed="true">Hepsi</button>
      <button class="chip" type="button" data-f="miss" aria-pressed="false">Eksik cilt</button>
      <button class="chip" type="button" data-f="ok" aria-pressed="false">Güncel</button>
    </div>
  </div>

  <div id="list"><div class="empty"><strong>Raf hazırlanıyor</strong>Mangalar birazdan burada dizilecek. Yönetim'den yeni seri ekleyebilirsin.</div></div>
</div>

<div class="overlay" id="pwBox" hidden>
  <form class="modal" id="pwForm">
    <h2>Yönetim girişi</h2>
    <label>Şifre<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="err" id="pwErr"></p>
    <div class="mrow"><button class="btn" type="button" data-close>Vazgeç</button><button class="btn primary" type="submit">Giriş</button></div>
  </form>
</div>

<div class="overlay" id="edBox" hidden>
  <form class="modal" id="edForm">
    <h2 id="edTitle">Manga ekle</h2>
    <label>Seri adı<input id="f_ad" required maxlength="80"></label>
    <div class="row2">
      <label>Son çıkan cilt<input id="f_cikan" type="number" min="0" max="999" required></label>
      <label>Son alınan cilt<input id="f_alinan" type="number" min="0" max="999" required></label>
    </div>
    <label>Link (satın alma / okuma)<input id="f_link" type="url" placeholder="https://…"></label>
    <label>Kapak fotoğrafı<input id="f_kapak" type="file" accept="image/*"></label>
    <p class="err" id="edErr"></p>
    <div class="mrow">
      <button class="btn" type="button" id="delBtn" hidden>Sil</button>
      <button class="btn" type="button" data-close>Vazgeç</button>
      <button class="btn primary" type="submit" id="saveBtn">Kaydet</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
