name: Stok tarama
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: tara
jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tarayici/tara.mjs site/mangalar.json site/stok.json
      - name: Sonucu site dalına yaz
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stok.json
          git commit -m "Stok taraması" || exit 0
          git pull --rebase origin site
          git push origin site
      # GITHUB_TOKEN ile yapılan push Pages'i kendiliğinden yeniden yayınlamıyor
      - run: gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ github.token }}
