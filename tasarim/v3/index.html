<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beyza'nın Mangaları</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Beyza'nın manga rafı: seriler, son çıkan ve son alınan ciltler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* V3 Kitaplık: okuma odası — adaçayı duvar, ceviz raf tahtaları, kapaklar rafta durur, eksikler bordo ayraç */
:root{
  --wall:#e6eae4; --wall2:#dde3dc; --card:#fbfcfa; --ink:#1d2f29; --soft:#3f524b; --muted:#6c7a74; --line:#cdd5ce;
  --wood:#7a5236; --wood-hi:#a67a54; --wood-dk:#4a2f1d;
  --ribbon:#9e1f3c; --ribbon-soft:#f6e6ea; --brass:#a9843e; --ok:#2f6b4f;
  --serif:"Cormorant Garamond","Garamond",Georgia,serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gap:30px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--wall);overflow-x:clip}
body{margin:0;color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 34px),linear-gradient(var(--wall),var(--wall2) 900px,var(--wall2))}
img{max-width:100%}
:focus-visible{outline:2px solid var(--ribbon);outline-offset:3px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left)) 72px;display:flex;flex-direction:column;gap:44px}

/* başlık */
.topbar{display:flex;justify-content:flex-end;padding-top:18px}
.head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:-6px}
.eyebrow{font:600 11px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--brass)}
h1{font:500 clamp(46px,9vw,104px)/.95 var(--serif);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1 em{font-style:italic;color:var(--ribbon)}
.orn{display:flex;align-items:center;gap:12px;color:var(--brass);width:min(280px,70%)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:currentColor}
.orn i{width:7px;height:7px;transform:rotate(45deg);border:1px solid currentColor}
.dek{font:italic 500 clamp(18px,2.4vw,22px)/1.35 var(--serif);color:var(--soft);margin:0;max-width:36ch}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:6px}
.stats span{display:flex;flex-direction:column;align-items:center;min-width:104px;padding:10px 16px;background:rgba(255,255,255,.55);border:1px solid rgba(29,47,41,.1);border-radius:10px;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats b{font:600 34px/1 var(--serif);letter-spacing:0;color:var(--ink);font-variant-numeric:lining-nums}
.stats span:nth-child(3) b{color:var(--ribbon)}

/* düğmeler */
.btn{font:600 14px var(--sans);border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:9px 18px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--card)}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.primary:hover{background:var(--ribbon);border-color:var(--ribbon)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.5}

.adminbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ink);color:var(--card);border-radius:12px;padding:10px 12px 10px 18px}
.adminbar .t{flex:1;font:italic 600 19px var(--serif)}
.adminbar .btn{border-color:rgba(255,255,255,.5);color:var(--card)}
.adminbar .btn:hover{background:var(--card);color:var(--ink)}
.adminbar .btn.primary{background:var(--brass);border-color:var(--brass);color:#fff}

/* arama + filtre */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.bar h2{font:italic 600 32px/1 var(--serif);margin:0 auto 0 0;flex:0 0 auto}
.bar input{flex:0 1 300px;min-width:0;font:400 16px var(--sans);padding:10px 16px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.bar input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,47,41,.12)}
.chips{display:flex;gap:4px;background:rgba(255,255,255,.55);padding:4px;border-radius:12px;border:1px solid rgba(29,47,41,.1)}
.chip{font:600 13px var(--sans);padding:0 14px;min-height:36px;border:0;border-radius:8px;background:transparent;color:var(--soft);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(29,47,41,.18)}

/* kitaplık: her kapak bir raf tahtasının üstünde durur */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:56px var(--gap);padding-inline:6px}
.m{position:relative;container-type:inline-size;display:flex;flex-direction:column;gap:8px;min-width:0}
.m::before{content:"";position:absolute;z-index:0;top:calc(150cqw - 3px);left:calc(var(--gap) / -2 - 1px);right:calc(var(--gap) / -2 - 1px);height:22px;
  background:linear-gradient(var(--wood-hi),var(--wood) 25%,var(--wood) 70%,var(--wood-dk));box-shadow:0 14px 16px -8px rgba(40,25,15,.45);border-radius:1px}
.m::after{content:"";position:absolute;z-index:0;top:calc(150cqw - 3px);left:calc(var(--gap) / -2 - 1px);right:calc(var(--gap) / -2 - 1px);height:3px;background:rgba(255,235,210,.35)}
.cover{position:relative;z-index:1;aspect-ratio:2/3;margin-bottom:34px;border-radius:2px 4px 4px 2px;overflow:hidden;background:var(--card);
  box-shadow:-10px 0 18px -10px rgba(29,47,41,.35),8px -4px 24px -10px rgba(29,47,41,.28),0 3px 2px -1px rgba(40,25,15,.55);transform-origin:50% 100%;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.18) 2.5%,transparent 6%,transparent 92%,rgba(0,0,0,.12));pointer-events:none}
.m:hover .cover{transform:translateY(-8px) rotate(-1.2deg)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;font:italic 600 22px/1.1 var(--serif);color:var(--ink);background:linear-gradient(135deg,#f3f5f1,#dfe6df)}
/* eksik: sayfadan sarkan bordo ayraç; yeni cilt: pirinç etiket; güncel: küçük beyaz rozet */
.stamp{position:absolute;z-index:2;top:0;left:12px;width:64px;padding:16px 4px 26px;text-align:center;background:linear-gradient(90deg,#8a1a33,var(--ribbon) 40%,#b12a49);color:#fff;font:700 12.5px/1.15 var(--sans);letter-spacing:.01em;
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 11px),0 100%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.stamp.ok{top:auto;bottom:8px;left:8px;width:auto;padding:4px 10px 4px 8px;clip-path:none;background:rgba(251,252,250,.92);color:var(--ok);font:600 11px var(--sans);border-radius:999px;display:flex;align-items:center;gap:5px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.stamp.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.stamp.new{top:12px;left:auto;right:0;width:auto;padding:5px 9px 5px 11px;clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);background:linear-gradient(var(--brass),#8d6b2c);font:700 11px var(--sans)}
.m h3{margin:0;font:600 21px/1.1 var(--serif);overflow-wrap:anywhere;text-wrap:balance}
.vols{display:flex;justify-content:space-between;font:500 12px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.vols b{color:var(--ink);font-weight:700}
.track{display:flex;gap:2px;height:6px}
.track i{flex:1;background:var(--line);border-radius:2px}
.track i.on{background:var(--ok)}
.track i.miss{background:var(--ribbon)}
.buy{display:flex;flex-direction:column;gap:8px;background:var(--ribbon-soft);border-radius:10px;padding:10px;margin-top:4px}
.buy .v{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.buy .v>span{flex-basis:100%;font:italic 600 16px var(--serif);color:var(--ribbon)}
.shop{font:600 12px var(--sans);padding:5px 10px;min-height:30px;display:inline-flex;align-items:center;border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;border:1px solid rgba(158,31,60,.25)}
.shop:hover{background:var(--ribbon);color:#fff;border-color:var(--ribbon)}
.shop.none{background:transparent;border:0;color:var(--muted);padding-inline:0}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.empty{background:rgba(255,255,255,.6);border:1px dashed var(--line);border-radius:14px;padding:48px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font:italic 600 28px var(--serif);color:var(--ink);margin-bottom:4px}

/* okuma listesi */
.sepet{position:relative;display:flex;flex-direction:column;gap:14px;background:var(--card);border-radius:16px;padding:clamp(20px,3.5vw,36px);box-shadow:0 1px 0 rgba(29,47,41,.08),0 24px 50px -30px rgba(29,47,41,.45)}
.sepet::before{content:"";position:absolute;top:0;right:clamp(20px,5vw,48px);width:30px;height:64px;background:linear-gradient(90deg,#8a1a33,var(--ribbon) 40%,#b12a49);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 10px),0 100%)}
.sepet h2{font:600 clamp(30px,4.6vw,44px)/1 var(--serif);margin:0;padding-right:56px}
.sepet h2::before{content:"Okuma listesi";display:block;font:600 11px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--brass);margin-bottom:10px}
.sepet .alt{color:var(--soft);font-size:15px;margin:0;max-width:66ch}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.store{background:#f2f5f1;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.store.all{background:#eaf3ed;border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.store header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.store h3{margin:0;font:600 23px var(--serif)}
.store .cnt{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ribbon);background:var(--ribbon-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.store .tag{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--ok)}
.store ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.store li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.store li a{color:var(--ink);text-decoration:underline;text-decoration-color:rgba(158,31,60,.45);text-underline-offset:3px;overflow-wrap:anywhere}
.store li a:hover{color:var(--ribbon)}
.store li b{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.store .top{display:flex;justify-content:space-between;align-items:baseline;font:600 18px var(--serif)}
.store .top b{font:700 15px var(--sans)}
.yok{font-size:13px;color:var(--muted);margin:0}

.foot{text-align:center;font:italic 500 17px var(--serif);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}

/* pencereler */
.overlay{position:fixed;inset:0;background:rgba(29,47,41,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--card);color:var(--ink);border-radius:18px;width:100%;max-width:470px;max-height:calc(100dvh - 32px);overflow:auto;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 70px -20px rgba(29,47,41,.55);border-top:4px solid var(--ribbon)}
.modal h2{font:600 30px/1.05 var(--serif);margin:0 0 4px}
label{display:flex;flex-direction:column;gap:6px;font:600 13px var(--sans);color:var(--soft)}
.modal input{font:400 16px var(--sans);padding:10px 12px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#f4f6f3;color:var(--ink);min-width:0}
.modal input:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(29,47,41,.12)}
.modal input[type=file]{font-size:13px;padding:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--ribbon);font-size:13px;min-height:1em;margin:0}
.mrow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#delBtn{margin-right:auto;border-color:var(--ribbon);color:var(--ribbon)}
#delBtn:hover{background:var(--ribbon);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 20px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}

@media (max-width:640px){
  :root{--gap:16px}
  .wrap{gap:34px;padding-inline:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:42px var(--gap);padding-inline:0}
  .m::before,.m::after{left:-8px;right:-8px}
  .m h3{font-size:19px}
  .stats span{min-width:0;flex:1;padding:8px 6px;font-size:10px;letter-spacing:.06em}
  .stats b{font-size:28px}
  .bar h2{flex-basis:100%}
  .bar input{flex:1 1 100%}
  .chips{width:100%}.chip{flex:1;padding:0 6px}
  .stamp{width:56px;font-size:11px;left:8px;padding:12px 3px 22px}
  .modal{padding:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="btn sm" id="adminBtn" type="button">Yönetim</button></div>
  <header class="head">
    <span class="eyebrow">Kişisel kitaplık</span>
    <h1>Beyza'nın <em>Mangaları</em></h1>
    <span class="orn" aria-hidden="true"><i></i></span>
    <p class="dek">Raftaki her seri, elimdeki son cilt ve sıradaki eksikler.</p>
    <div class="stats" id="stats"><span>Raf yükleniyor…</span></div>
  </header>

  <div class="adminbar" id="adminbar" hidden>
    <span class="t">Yönetim modu açık</span>
    <button class="btn primary sm" id="addBtn" type="button">+ Manga ekle</button>
    <button class="btn sm" id="logoutBtn" type="button">Çıkış</button>
  </div>

  <section class="sepet" id="sepet" hidden></section>

  <div class="bar">
    <h2>Raf</h2>
    <input id="q" type="search" placeholder="Seri ara…" aria-label="Seri ara">
    <div class="chips" role="group" aria-label="Filtre">
      <button class="chip" type="button" data-f="all" aria-pressed="true">Hepsi</button>
      <button class="chip" type="button" data-f="miss" aria-pressed="false">Eksik cilt</button>
      <button class="chip" type="button" data-f="ok" aria-pressed="false">Güncel</button>
    </div>
  </div>

  <div id="list"><div class="empty"><strong>Raf hazırlanıyor</strong>Mangalar birazdan burada dizilecek. Yönetim'den yeni seri ekleyebilirsin.</div></div>

  <footer class="foot"><span class="orn" aria-hidden="true"><i></i></span>Beyza'nın Mangaları</footer>
</div>

<div class="overlay" id="pwBox" hidden>
  <form class="modal" id="pwForm">
    <h2>Yönetim girişi</h2>
    <label>Şifre<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="err" id="pwErr"></p>
    <div class="mrow"><button class="btn" type="button" data-close>Vazgeç</button><button class="btn primary" type="submit">Giriş</button></div>
  </form>
</div>

<div class="overlay" id="edBox" hidden>
  <form class="modal" id="edForm">
    <h2 id="edTitle">Manga ekle</h2>
    <label>Seri adı<input id="f_ad" required maxlength="80"></label>
    <div class="row2">
      <label>Son çıkan cilt<input id="f_cikan" type="number" min="0" max="999" required></label>
      <label>Son alınan cilt<input id="f_alinan" type="number" min="0" max="999" required></label>
    </div>
    <label>Link (satın alma / okuma)<input id="f_link" type="url" placeholder="https://…"></label>
    <label>Mağazalarda arama adı (boşsa seri adı)<input id="f_ara" maxlength="80" placeholder="ör. Jigokuraku"></label>
    <label>Kapak fotoğrafı<input id="f_kapak" type="file" accept="image/*"></label>
    <p class="err" id="edErr"></p>
    <div class="mrow">
      <button class="btn" type="button" id="delBtn" hidden>Sil</button>
      <button class="btn" type="button" data-close>Vazgeç</button>
      <button class="btn primary" type="submit" id="saveBtn">Kaydet</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
