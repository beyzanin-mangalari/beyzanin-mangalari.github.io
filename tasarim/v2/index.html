<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beyza'nın Mangaları</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Beyza'nın manga rafı: seriler, son çıkan ve son alınan ciltler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* V2 Panel: manga sayfası — kalın panel çerçeveleri, hız çizgileri, ekran tonu, patlama balonları */
:root{
  --paper:#fbfaf7; --white:#ffffff; --ink:#0d0d0d; --gray:#5c5c5c; --tone:rgba(13,13,13,.13);
  --red:#e3201b; --yellow:#ffdd00; --blue:#1f4fd6;
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --burst:polygon(50% 0%,56.9% 10.6%,67.1% 3%,68% 18.8%,82.1% 11.7%,80.6% 24.3%,93.3% 25%,83.8% 37.7%,99.2% 41.3%,90% 50%,99.2% 58.7%,83.8% 62.3%,93.3% 75%,80.6% 75.7%,82.1% 88.3%,68% 81.2%,67.1% 97%,56.9% 89.4%,50% 100%,43.7% 85.5%,32.9% 97%,30% 84.6%,17.9% 88.3%,22.4% 73.1%,6.7% 75%,12.4% 63.7%,.8% 58.7%,14% 50%,.8% 41.3%,12.4% 36.3%,6.7% 25%,22.4% 26.9%,17.9% 11.7%,30% 15.4%,32.9% 3%,43.7% 14.5%);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper);overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.5 var(--body);
  background-image:radial-gradient(var(--tone) 1px,transparent 1.2px);background-size:6px 6px}
img{max-width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 64px;display:flex;flex-direction:column;gap:26px}

/* kapak paneli: hız çizgileri */
.hero{position:relative;background:var(--white);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:clamp(22px,4vw,44px);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-50%;z-index:-1;
  background:repeating-conic-gradient(from 0deg at 72% 50%,var(--ink) 0deg .55deg,transparent .55deg 4.5deg);
  -webkit-mask:radial-gradient(circle at 72% 50%,transparent 0 21%,#000 46%);mask:radial-gradient(circle at 72% 50%,transparent 0 21%,#000 46%);opacity:.9}
.hero-in{position:relative;display:flex;flex-direction:column;gap:14px}
.hero-in>:not(.toprow){max-width:640px}
.kicker{align-self:flex-start;background:var(--ink);color:var(--yellow);font:900 12px var(--body);letter-spacing:.18em;text-transform:uppercase;padding:6px 12px;transform:skewX(-10deg)}
h1{font:400 clamp(44px,9.5vw,112px)/.9 var(--display);margin:0;letter-spacing:-.02em;color:var(--ink)}
h1 span{display:block;color:var(--white);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--red)}
.bubble{position:relative;align-self:flex-start;background:var(--white);border:3px solid var(--ink);border-radius:50% / 46%;padding:14px 26px;font-weight:700;font-size:15px;max-width:34ch;margin-left:8px}
.bubble::after{content:"";position:absolute;left:28px;bottom:-16px;width:22px;height:18px;background:var(--white);border:3px solid var(--ink);border-top:0;border-right:0;transform:skewX(30deg)}
.tate{position:absolute;right:clamp(16px,4vw,46px);bottom:clamp(22px,4vw,44px);writing-mode:vertical-rl;white-space:nowrap;font:400 clamp(30px,5vw,58px)/1 var(--display);letter-spacing:.08em;color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;background:var(--red);border:4px solid var(--ink);padding:16px 10px;box-shadow:6px 6px 0 var(--ink)}
@media (max-width:760px){.tate{display:none}.hero::before{background:repeating-conic-gradient(from 0deg at 100% 0%,var(--ink) 0deg .6deg,transparent .6deg 5deg);-webkit-mask:radial-gradient(circle at 100% 0%,transparent 0 30%,#000 70%);mask:radial-gradient(circle at 100% 0%,transparent 0 30%,#000 70%);opacity:.35}}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:flex;flex-wrap:wrap;gap:8px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.stats span{background:var(--white);border:2.5px solid var(--ink);padding:5px 12px 5px 6px;display:inline-flex;align-items:center;gap:8px}
.stats b{font:400 17px var(--display);background:var(--ink);color:var(--white);padding:1px 8px;min-width:30px;text-align:center}
.stats span:nth-child(3) b{background:var(--red)}

/* düğmeler */
.btn{font:900 14px var(--body);letter-spacing:.03em;border:3px solid var(--ink);background:var(--white);color:var(--ink);border-radius:0;padding:8px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--yellow)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--red);color:var(--white)}
.btn.primary:hover{background:var(--ink)}
.btn.sm{padding:4px 11px;min-height:36px;font-size:13px;border-width:2.5px;box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.5}

.adminbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--yellow);border:3px solid var(--ink);padding:10px 14px;box-shadow:6px 6px 0 var(--ink)}
.adminbar .t{flex:1;font:400 16px var(--display)}

/* arama + filtre */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.bar input{flex:1 1 240px;min-width:0;font:700 16px var(--body);padding:10px 16px;min-height:48px;border:3px solid var(--ink);border-radius:0;background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.bar input::placeholder{color:var(--gray)}
.bar input:focus{outline:none;box-shadow:4px 4px 0 var(--blue)}
.chips{display:flex;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--white)}
.chip{font:900 14px var(--body);padding:0 16px;min-height:42px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.chip+.chip{border-left:3px solid var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.chip:hover:not([aria-pressed="true"]){background:var(--yellow)}

/* panel ızgarası */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:26px 22px;align-items:start}
.m{display:flex;flex-direction:column;gap:9px;min-width:0;background:var(--white);border:3px solid var(--ink);padding:10px 10px 12px;box-shadow:5px 5px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.m:nth-child(4n+2){transform:rotate(.5deg)}
.m:nth-child(4n+3){transform:rotate(-.4deg)}
.m:hover{transform:translate(-2px,-3px) rotate(0);box-shadow:8px 9px 0 var(--ink)}
.cover{position:relative;aspect-ratio:2/3;border:2.5px solid var(--ink);background:var(--white)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;font:400 22px/1.1 var(--display);background:radial-gradient(var(--tone) 1.3px,transparent 1.5px) 0 0/6px 6px,var(--white)}
/* eksik: kırmızı patlama; güncel: siyah etiket; yeni cilt: sarı etiket */
.stamp{position:absolute;z-index:1;top:-14px;right:-14px;width:92px;height:92px;display:grid;place-items:center;text-align:center;padding:22px;
  background:var(--red);color:var(--white);font:400 13px/1.05 var(--display);clip-path:var(--burst);transform:rotate(-8deg);
}
.m:has(.stamp:not(.ok):not(.new)) .stamp:not(.new){animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4) rotate(-30deg)}}
.stamp.ok{top:auto;bottom:8px;left:-8px;right:auto;width:auto;height:auto;clip-path:none;padding:4px 12px;background:var(--ink);color:var(--white);font:900 12px var(--body);letter-spacing:.12em;text-transform:uppercase;transform:skewX(-10deg);animation:none}

.stamp.new{top:10px;left:-8px;right:auto;width:auto;height:auto;clip-path:none;padding:5px 10px;background:var(--yellow);color:var(--ink);border:2.5px solid var(--ink);font:900 12px var(--body);transform:rotate(-3deg);box-shadow:3px 3px 0 var(--ink)}

.m:has(.stamp:not(.ok):not(.new)){border-color:var(--red);box-shadow:5px 5px 0 var(--red)}
.m h3{margin:2px 0 0;font:400 17px/1.15 var(--display);overflow-wrap:anywhere}
.vols{display:flex;justify-content:space-between;font-weight:700;font-size:12px;color:var(--gray);font-variant-numeric:tabular-nums}
.vols b{color:var(--ink);font:400 14px var(--display)}
.track{display:flex;gap:2px;height:10px}
.track i{flex:1;background:var(--white);border:1.5px solid var(--ink)}
.track i.on{background:var(--ink)}
.track i.miss{background:repeating-linear-gradient(-45deg,var(--red) 0 2px,var(--white) 2px 4px);border-color:var(--red)}
.buy{display:flex;flex-direction:column;gap:8px;background:radial-gradient(rgba(227,32,27,.18) 1px,transparent 1.3px) 0 0/5px 5px,#fff4f3;border:2px dashed var(--red);padding:8px}
.buy .v{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.buy .v>span{flex-basis:100%;font:400 13px var(--display);color:var(--red)}
.shop{font:900 12px var(--body);padding:5px 9px;min-height:30px;display:inline-flex;align-items:center;background:var(--white);border:2px solid var(--ink);color:var(--ink);text-decoration:none;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.shop:hover{background:var(--yellow)}
.shop.none{background:transparent;border:0;box-shadow:none;color:var(--gray);padding-inline:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.empty{background:var(--white);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:44px 20px;text-align:center;font-weight:700;color:var(--gray)}
.empty strong{display:block;font:400 26px var(--display);color:var(--ink);margin-bottom:6px}

/* eksik paneli */
.sepet{position:relative;display:flex;flex-direction:column;gap:14px;background:var(--yellow);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:clamp(18px,3vw,30px);overflow:hidden;isolation:isolate}
.sepet::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(rgba(13,13,13,.16) 1.4px,transparent 1.6px) 0 0/7px 7px;-webkit-mask:linear-gradient(115deg,transparent 45%,#000);mask:linear-gradient(115deg,transparent 45%,#000)}
.sepet h2{align-self:flex-start;font:400 clamp(28px,5vw,46px)/1 var(--display);margin:0;color:var(--white);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.sepet h2::after{content:"!!";color:var(--red);margin-left:.1em}
.sepet .alt{font-weight:700;font-size:14px;margin:0;max-width:70ch}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.store{background:var(--white);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.store:first-child{transform:rotate(-.6deg)}
.store.all{box-shadow:5px 5px 0 var(--red);border-color:var(--red)}
.store header{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:3px solid var(--ink);padding-bottom:8px}
.store h3{margin:0;font:400 20px var(--display)}
.store .cnt{font:900 12px var(--body);background:var(--ink);color:var(--yellow);padding:3px 8px;white-space:nowrap}
.store .tag{align-self:flex-start;font:900 12px var(--body);background:var(--red);color:var(--white);padding:3px 10px;transform:skewX(-10deg)}
.store ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.store li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;font-weight:700;padding:4px 0}
.store li a{color:var(--ink);text-decoration:underline 2px;text-decoration-color:var(--red);text-underline-offset:4px;overflow-wrap:anywhere}
.store li a:hover{background:var(--yellow)}
.store li b{font:900 14px var(--body);white-space:nowrap;font-variant-numeric:tabular-nums}
.store .top{border-top:3px dotted var(--ink);padding-top:8px;display:flex;justify-content:space-between;font:400 15px var(--display)}
.yok{font-size:13px;font-weight:700;margin:0;background:var(--white);border:2px solid var(--ink);padding:6px 10px;align-self:flex-start}

.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font:900 12px var(--body);letter-spacing:.14em;text-transform:uppercase;border-top:4px solid var(--ink);padding-top:12px}
.foot span:last-child{font:400 14px var(--display);letter-spacing:.1em}

/* pencereler */
.overlay{position:fixed;inset:0;background:radial-gradient(rgba(0,0,0,.35) 1.2px,transparent 1.4px) 0 0/5px 5px,rgba(13,13,13,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--white);color:var(--ink);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);width:100%;max-width:480px;max-height:calc(100dvh - 32px);overflow:auto;padding:0 22px 22px;display:flex;flex-direction:column;gap:14px}
.modal h2{font:400 22px var(--display);margin:0 -22px 4px;background:var(--ink);color:var(--white);padding:12px 22px;border-bottom:4px solid var(--red)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:900}
.modal input{font:700 16px var(--body);padding:10px 12px;min-height:46px;border:2.5px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);min-width:0}
.modal input:focus{outline:none;background:#fffbe0;box-shadow:3px 3px 0 var(--ink)}
.modal input[type=file]{font-size:13px;padding:9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--red);font-size:13px;font-weight:900;min-height:1em;margin:0}
.mrow{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
#delBtn{margin-right:auto;color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:10px 18px;font-weight:900;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:520px){
  .wrap{gap:22px}
  .hero{box-shadow:6px 6px 0 var(--ink);border-width:3px}
  h1 span{-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--red)}
  .bubble{font-size:14px;padding:12px 20px}
  .kicker{font-size:10px;letter-spacing:.1em;padding:6px 9px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
  .m{padding:7px 7px 10px;box-shadow:4px 4px 0 var(--ink)}
  .m:has(.stamp:not(.ok):not(.new)){box-shadow:4px 4px 0 var(--red)}
  .m h3{font-size:15px}
  .stamp{width:76px;height:76px;padding:18px;font-size:11px;top:-12px;right:-12px}
  .stamp.new,.stamp.ok{font-size:11px}
  .chips{width:100%}.chip{flex:1;padding:0 6px;font-size:13px}
  .sepet{box-shadow:6px 6px 0 var(--ink)}
  .shop{white-space:normal}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-in">
      <div class="toprow">
        <span class="kicker">Manga rafı · cilt takibi</span>
        <button class="btn sm" id="adminBtn" type="button">Yönetim</button>
      </div>
      <h1>Beyza'nın <span>Mangaları</span></h1>
      <p class="bubble">Hangi cilt elimde, hangisi eksik? Hepsi bu sayfada!</p>
      <div class="stats" id="stats"><span>Raf yükleniyor…</span></div>
    </div>
    <div class="tate" aria-hidden="true">漫画の棚</div>
  </header>

  <div class="adminbar" id="adminbar" hidden>
    <span class="t">Yönetim modu açık</span>
    <button class="btn primary sm" id="addBtn" type="button">+ Manga ekle</button>
    <button class="btn sm" id="logoutBtn" type="button">Çıkış</button>
  </div>

  <section class="sepet" id="sepet" hidden></section>

  <div class="bar">
    <input id="q" type="search" placeholder="Seri ara…" aria-label="Seri ara">
    <div class="chips" role="group" aria-label="Filtre">
      <button class="chip" type="button" data-f="all" aria-pressed="true">Hepsi</button>
      <button class="chip" type="button" data-f="miss" aria-pressed="false">Eksik cilt</button>
      <button class="chip" type="button" data-f="ok" aria-pressed="false">Güncel</button>
    </div>
  </div>

  <div id="list"><div class="empty"><strong>Raf hazırlanıyor</strong>Mangalar birazdan burada dizilecek. Yönetim'den yeni seri ekleyebilirsin.</div></div>

  <footer class="foot"><span>Beyza'nın Mangaları</span><span>つづく…</span></footer>
</div>

<div class="overlay" id="pwBox" hidden>
  <form class="modal" id="pwForm">
    <h2>Yönetim girişi</h2>
    <label>Şifre<input id="pw" type="password" autocomplete="current-password"></label>
    <p class="err" id="pwErr"></p>
    <div class="mrow"><button class="btn" type="button" data-close>Vazgeç</button><button class="btn primary" type="submit">Giriş</button></div>
  </form>
</div>

<div class="overlay" id="edBox" hidden>
  <form class="modal" id="edForm">
    <h2 id="edTitle">Manga ekle</h2>
    <label>Seri adı<input id="f_ad" required maxlength="80"></label>
    <div class="row2">
      <label>Son çıkan cilt<input id="f_cikan" type="number" min="0" max="999" required></label>
      <label>Son alınan cilt<input id="f_alinan" type="number" min="0" max="999" required></label>
    </div>
    <label>Link (satın alma / okuma)<input id="f_link" type="url" placeholder="https://…"></label>
    <label>Mağazalarda arama adı (boşsa seri adı)<input id="f_ara" maxlength="80" placeholder="ör. Jigokuraku"></label>
    <label>Kapak fotoğrafı<input id="f_kapak" type="file" accept="image/*"></label>
    <p class="err" id="edErr"></p>
    <div class="mrow">
      <button class="btn" type="button" id="delBtn" hidden>Sil</button>
      <button class="btn" type="button" data-close>Vazgeç</button>
      <button class="btn primary" type="submit" id="saveBtn">Kaydet</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
